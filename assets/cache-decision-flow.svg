<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840">
<rect width="1200" height="840" fill="#F7F1E6"/>
<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B5747"/></marker>
  </defs>
<text x="56" y="62" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#241C16" text-anchor="start" opacity="1" letter-spacing="0">编译缓存如何决定「复用还是重编译」</text>
<text x="56" y="92" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14.5" font-weight="400" fill="#7A6A5C" text-anchor="start" opacity="1" letter-spacing="0">只接管 5 个便捷 API；mm(list, p) 主循环不经过这里</text>
<rect x="640" y="140" width="470" height="120" rx="10" fill="#F3EBDD" stroke="#DDCDB5" stroke-width="1.2" opacity="1"/>
<text x="664" y="174" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15.5" font-weight="700" fill="#241C16" text-anchor="start" opacity="1" letter-spacing="0">mm(list, p) 不经过这里</text>
<text x="664" y="202" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#7A6A5C" text-anchor="start" opacity="1" letter-spacing="0">每个 pattern 每调用只编译 1 次，结果用于整个列表；</text>
<text x="664" y="224" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#7A6A5C" text-anchor="start" opacity="1" letter-spacing="0">基准 0.99×，主匹配循环零改动。</text>
<rect x="108" y="140" width="320" height="58" rx="10" fill="#FFFBF2" stroke="#CDBBA3" stroke-width="1.5" opacity="1"/>
<text x="128" y="174" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#241C16" text-anchor="start" opacity="1" letter-spacing="0">pattern + options</text>
<path d="M 268 198 L 268 236" fill="none" stroke="#6B5747" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/>
<rect x="108" y="236" width="320" height="70" rx="10" fill="#FFFBF2" stroke="#CDBBA3" stroke-width="1.5" opacity="1"/>
<text x="128" y="268" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#241C16" text-anchor="start" opacity="1" letter-spacing="0">1  构造缓存键</text>
<text x="128" y="290" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#7A6A5C" text-anchor="start" opacity="1" letter-spacing="0">长度前缀 pattern + 排序序列化 options</text>
<path d="M 268 306 L 268 330" fill="none" stroke="#6B5747" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/>
<polygon points="268,330 400,388 268,446 136,388" fill="#F6E6C9" stroke="#D08A2C" stroke-width="1.8"/><text x="268" y="386" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15.5" font-weight="700" fill="#241C16" text-anchor="middle" opacity="1" letter-spacing="0">2  LRU 命中？</text><text x="268" y="408" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#7A6A5C" text-anchor="middle" opacity="1" letter-spacing="0">Map.get</text>
<path d="M 400 388 L 520 388 L 520 360 L 640 360" fill="none" stroke="#6B5747" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/>
<text x="470" y="378" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#6F7F4E" text-anchor="start" opacity="1" letter-spacing="0">是</text>
<rect x="640" y="326" width="470" height="68" rx="10" fill="#F1F3E8" stroke="#B9C3A2" stroke-width="1.5" opacity="1"/>
<text x="660" y="357" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#241C16" text-anchor="start" opacity="1" letter-spacing="0">重排 LRU → 直接返回 matcher</text>
<text x="660" y="379" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#7A6A5C" text-anchor="start" opacity="1" letter-spacing="0">命中率 99.8%（8k 次 isMatch）</text>
<path d="M 268 446 L 268 486" fill="none" stroke="#6B5747" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/>
<text x="280" y="470" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#7A6A5C" text-anchor="start" opacity="1" letter-spacing="0">否</text>
<polygon points="268,486 400,544 268,602 136,544" fill="#F6E6C9" stroke="#D08A2C" stroke-width="1.8"/><text x="268" y="542" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15.5" font-weight="700" fill="#241C16" text-anchor="middle" opacity="1" letter-spacing="0">3  首次出现？</text><text x="268" y="564" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#7A6A5C" text-anchor="middle" opacity="1" letter-spacing="0">seenOnce</text>
<path d="M 400 544 L 520 544 L 520 516 L 640 516" fill="none" stroke="#6B5747" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/>
<text x="462" y="534" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#7A6A5C" text-anchor="start" opacity="1" letter-spacing="0">是（首次）</text>
<rect x="640" y="482" width="470" height="68" rx="10" fill="#FBF3E6" stroke="#D9C4A3" stroke-width="1.5" opacity="1"/>
<text x="660" y="513" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#241C16" text-anchor="start" opacity="1" letter-spacing="0">编译 → 记下键 → 返回</text>
<text x="660" y="535" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" font-weight="400" fill="#7A6A5C" text-anchor="start" opacity="1" letter-spacing="0">不保留：一次性 pattern 不占缓存、不压 GC</text>
<path d="M 268 602 L 268 646" fill="none" stroke="#6B5747" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/>
<text x="280" y="628" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#BF4E2A" text-anchor="start" opacity="1" letter-spacing="0">否（第二次）</text>
<rect x="108" y="646" width="1002" height="68" rx="10" fill="#F9E8E1" stroke="#D8A894" stroke-width="1.5" opacity="1"/>
<text x="128" y="685" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#241C16" text-anchor="start" opacity="1" letter-spacing="0">4  编译 → 写入 LRU（默认 256 条）→ 淘汰最旧 → 返回 matcher</text>
<text x="56" y="788" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#7A6A5C" text-anchor="start" opacity="1" letter-spacing="0">带函数的 options（onResult / onMatch / onIgnore / format / expandRange）直接走原路径，不进入缓存：matcher 闭包会捕获回调，共享会串用。</text>
<text x="56" y="810" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#A29383" text-anchor="start" opacity="1" letter-spacing="0">单条 4–10 KB · 默认 2 MB 量级 · setMaxEntries(0) 可整体关闭 · 返回的 matcher 无状态</text>
</svg>